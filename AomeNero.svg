<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <defs>
    <!-- 浅色手绘风背景 -->
    <rect id="bg2" width="1200" height="400" fill="#f6f8fa"/>
  </defs>

  <!-- 背景色 -->
  <use href="#bg2"/>

  <!-- 手绘线条装饰 -->
  <path d="M 50 50 C 150 20, 250 80, 350 50" stroke="#24292e" stroke-width="2" fill="none" opacity="0.3">
    <animate attributeName="stroke-dasharray" values="0, 500; 500, 0; 0, 500" dur="12s" repeatCount="indefinite"/>
  </path>
  <path d="M 850 350 C 950 320, 1050 380, 1150 350" stroke="#24292e" stroke-width="2" fill="none" opacity="0.3">
    <animate attributeName="stroke-dasharray" values="0, 500; 500, 0; 0, 500" dur="15s" repeatCount="indefinite"/>
  </path>

  <!-- 手绘图标 -->
  <!-- 终端图标 -->
  <g transform="translate(100, 150)" stroke="#24292e" stroke-width="2" fill="none">
    <rect x="0" y="0" width="60" height="45" rx="5"/>
    <path d="M 10 15 L 20 22.5 L 10 30" stroke-width="2.5"/>
    <line x1="25" y1="30" x2="40" y2="30" stroke-width="2.5"/>
     <animateTransform attributeName="transform" type="translate" values="100, 150; 102, 152; 100, 150" dur="5s" repeatCount="indefinite"/>
  </g>
  
  <!-- 芯片图标 -->
  <g transform="translate(1050, 150)" stroke="#24292e" stroke-width="2" fill="none">
    <rect x="0" y="0" width="50" height="50" rx="3"/>
    <circle cx="25" cy="25" r="10"/>
    <line x1="10" y1="10" x2="40" y2="40"/>
    <line x1="10" y1="40" x2="40" y2="10"/>
     <animateTransform attributeName="transform" type="translate" values="1050, 150; 1048, 148; 1050, 150" dur="6s" repeatCount="indefinite"/>
  </g>

  <!-- 主标题 AomeNero (手绘感字体) -->
  <text x="600" y="200" 
        font-family="'Comic Sans MS', cursive, sans-serif"
        font-weight="700" 
        font-size="90" 
        fill="#24292e" 
        text-anchor="middle" 
        dominant-baseline="central"
        letter-spacing="3">
    AomeNero
  </text>
  
  <!-- 手绘副标题 -->
  <text x="600" y="280" 
        font-family="'Courier New', Courier, monospace"
        font-weight="400" 
        font-size="22" 
        fill="#586069" 
        text-anchor="middle" 
        dominant-baseline="central"
        letter-spacing="1">
    ~~ Welcome to AomeNero GitHub ~~
  </text>

</svg>
